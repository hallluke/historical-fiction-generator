<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlikely Historical Bestseller Generator — Illustrated Edition</title>
<style>
:root {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #242424;
    background: #f6f5f2;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 7px 12px 20px;
}

.app {
    max-width: 650px;
    margin: auto;
    background: white;
    border: 1px solid #dedbd5;
    border-radius: 16px;
    padding: 15px 18px 18px;
    box-shadow: 0 6px 24px #0000000a;
}

.cover {
    background: #f5f3ee;
    text-align: center;
    border-radius: 12px;
    padding: 18px 18px 13px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
}

.eyebrow {
    text-transform: uppercase;
    letter-spacing: .14em;
    color: #666;
    font-size: 11px;
    font-weight: 700;
}

.cover h1 {
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(25px, 5vw, 36px);
    margin: 13px 0 5px;
    line-height: 1.25;
}

.subtitle {
    color: #777;
    width: 100%;
    max-width: 490px;
    height: 42px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.subtitle-text {
    display: block;
    width: 100%;
    font-size: 13px;
    line-height: 20px;
    text-wrap: balance;
    overflow-wrap: normal;
}


.book-author {font-family: Georgia, serif; font-size: 13px; color: #6c625c; min-height: 19px; margin-bottom: 3px;}
.review {margin: 3px auto 0; max-width: 470px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;}
.review-quote {font: italic 12px/17px Georgia, serif; color: #56504c; text-wrap: balance;}
.review-source {font-size: 10.5px; line-height: 15px; color: #77716c;}
/* Brief paper-confetti burst for newly generated prize winners. */
.confetti-layer {position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8;}
.confetti-piece {position:absolute;top:8%;left:50%;width:6px;height:10px;opacity:0;
  background:var(--confetti-colour);border-radius:1px;
  animation:paper-fall 1750ms cubic-bezier(.18,.65,.45,1) forwards;
  animation-delay:var(--delay);}
@keyframes paper-fall {
  0% {opacity:0;transform:translate(0,0) rotate(0deg) scale(.8);}
  10% {opacity:.9;}
  75% {opacity:.85;}
  100% {opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin));}
}
@media(prefers-reduced-motion:reduce) {.confetti-piece {animation:none;display:none;}}
/* A single, generously extended diagonal band. Its ends remain outside the
   clipped cover even when the award name wraps to a second line. */
.cover {overflow:hidden;}
.award-corner {
    position:absolute; z-index:5;
    top:48px; right:-85px; width:300px;
    transform:rotate(45deg); transform-origin:center;
    text-align:center; pointer-events:none;
    background:#a89576; color:#fff;
    padding:5px 48px 6px; box-sizing:border-box;
    box-shadow:0 2px 6px #0f172a30;
}
.award-corner[hidden] {display:none;}
.award-ribbon {
    font-size:10px; line-height:13px; font-weight:700;
    letter-spacing:.055em;
}
.award-label {
    margin-top:2px; font-size:8px; line-height:10px;
    font-weight:500; color:#fff9ef;
    overflow-wrap:normal;
    text-wrap:balance;
}
.award-symbol {margin-right:3px; font-size:9px;}
.award-corner.winner {background:#9c8050;}
@media(max-width:480px) {
    .award-corner {top:43px;right:-91px;width:292px;padding:4px 45px 5px;}
    .award-ribbon {font-size:9px;line-height:12px;}
    .award-label {font-size:7.5px;line-height:9px;}
}

.fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 11px;
    border: 1px solid #c9c9c9;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 14px;
}

.settings {
    margin: 22px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 400;
    margin: 0;
}

.check input {
    width: 17px;
    height: 17px;
    accent-color: #242424;
}

.lookback {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
}

.lookback select {
    width: auto;
}

.actions {
    display: flex;
    gap: 9px;
}

.actions button {
    border: 1px solid #222;
    border-radius: 9px;
    padding: 12px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
}

.primary {
    flex: 1;
    background: #242424;
    color: white;
}

.secondary {
    background: white;
    color: #242424;
}

button:hover {
    opacity: .84;
}

button:focus-visible,
select:focus-visible,
input:focus-visible {
    outline: 3px solid #789cc9;
    outline-offset: 2px;
}

.history {
    margin-top: 10px;
    border-top: 0;
    padding-top: 0;
}

.history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history h2 {
    font-size: 14px;
    margin: 0;
}

.clear {
    background: none;
    border: 0;
    text-decoration: underline;
    cursor: pointer;
    color: #555;
}

.history-scroll {
    max-height: 175px;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin-top: 12px;
    border-radius: 6px;
}

.history ol {
    list-style: none;
    padding: 0 8px 0 0;
    margin: 0;
}

.history li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-family: Georgia, serif;
    font-style: italic;
    margin: 0;
    padding: 8px 0;
    min-height: 35px;
}

.history-number {
    min-width: 2.5em;
    color: #777;
    font: normal 12px system-ui, sans-serif;
    text-align: right;
}

.history-title {
    flex: 1;
}

.status {
    font-size: 12px;
    color: #555;
    min-height: 0;
    margin-top: 0;
    text-align: right;
}

@media (max-width: 420px) {
    .fields {
        grid-template-columns: 1fr;
    }

    .app {
        padding: 16px;
    }

    .settings {
        align-items: flex-start;
        flex-direction: column;
    }
}

.advanced-options {margin:10px 0 0;border:1px solid #e4e1db;border-radius:9px;background:#fbfaf8;}
.advanced-options summary {cursor:pointer;list-style:none;padding:9px 12px;color:#635f59;font-size:12px;font-weight:600;display:flex;justify-content:space-between;}
.advanced-options summary::-webkit-details-marker {display:none;}
.advanced-options[open] summary span {transform:rotate(180deg);}
.advanced-content {padding:12px;border-top:1px solid #e4e1db;}
.advanced-content .settings {margin:13px 0 0;}
/* Pencil-and-wash book spines with visible shading and soft, offset shadows. */
.shelf-section {
    margin: -3px 0 9px;
}

.shelf-scroll {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: var(--shelf-height, 300px);
    min-height: var(--shelf-height, 300px);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 9px 5px;
    scrollbar-width: thin;
    scroll-behavior: smooth;
}

.shelf-scroll::after {
    content: "";
    flex: 0 0 1px;
}

.book-spine {
    display: block;
    flex: none;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    line-height: 0;
    transform-origin: bottom center;
}

.book-spine svg {
    display: block;
    overflow: visible;
}

.book-spine:hover,
.book-spine:focus-visible {
    transform: translateY(-5px);
}

.book-spine:focus-visible {
    outline: 2px solid #597d9b;
    outline-offset: 3px;
}

.shelf-base {
    height: 3px;
    margin: -3px 2px 0;
    background: #c8b4a0;
    border-radius: 50%;
    opacity: .55;
}

.shelf-note {
    font-size: 11px;
    color: #777;
    text-align: right;
    margin-top: 5px;
}

</style>
</head>
<body>
<main class="app">
  <section class="cover" aria-live="polite">
    <div class="eyebrow">The next unlikely historical bestseller</div>
    <h1 id="title">The Taxidermist of Timbuktu</h1>
    <div class="book-author" id="book-author">&nbsp;</div>
    <div class="subtitle" id="tagline"><span class="subtitle-text" id="tagline-text">An extraordinary tale of ordinary people in extraordinary times.</span></div>
    <div class="review"><div class="review-quote" id="review-quote"></div><div class="review-source" id="review-source"></div></div>
    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
    <div class="award-corner" id="award-corner" hidden>
      <div class="award-ribbon" id="award-ribbon"></div>
      <div class="award-label" id="award-label"><span class="award-symbol" aria-hidden="true">★</span><span id="award-text"></span></div>
    </div>
  </section>
  <section class="shelf-section" id="shelf-section" hidden aria-label="Illustrated bookshelf of generated titles">
    <div class="shelf-scroll" id="shelf-scroll" tabindex="0" aria-label="Scroll through generated book spines"></div>
    <div class="shelf-base"></div>
    <div class="shelf-note">Select a spine to revisit its book</div>
  </section>
  <div class="actions"><button class="primary" id="generate">Generate title</button><button class="secondary" id="copy">Copy</button></div>
  <details class="advanced-options" id="advanced-options">
    <summary>Settings <span aria-hidden="true">⌄</span></summary>
    <div class="advanced-content">
      <div class="fields">
        <div><label for="job">Occupation</label><select id="job"></select></div>
        <div><label for="place">Place</label><select id="place"></select></div>
      </div>
      <div class="settings">
        <label class="check"><input type="checkbox" id="avoid" checked> Avoid alliteration</label>
        <div class="lookback"><label for="lookback" style="margin:0">Exclude previous</label><select id="lookback"><option value="3">3 generations</option><option value="5" selected>5 generations</option></select></div>
      </div>
    </div>
  </details>
  <div id="status" class="status" role="status"></div>
  <section class="history" id="history-section" hidden>
    <div class="history-head"><h2>Previous generations</h2><button class="clear" id="clear">Clear history</button></div>
    <div class="history-scroll" tabindex="0" aria-label="Generated title history, newest first">
      <ol id="history"></ol>
    </div>
  </section>
</main>
<script>
'use strict';
const jobs = ["Taxidermist", "Embalmer", "Clockmaker", "Cartographer", "Cryptographer", "Bookbinder", "Glassblower", "Falconer", "Stonemason", "Puppeteer", "Silversmith", "Watchmaker", "Cooper", "Potter", "Weaver", "Calligrapher", "Luthier", "Engraver", "Milliner", "Tanner", "Chandler", "Typesetter", "Apothecary", "Gilder", "Dyer", "Locksmith", "Florist", "Barber", "Undertaker", "Cobbler", "Projectionist", "Groundskeeper", "Fishmonger", "Gravedigger", "Lamplighter", "Laundress", "Postman", "Caretaker", "Conductor", "Porter", "Concierge", "Chimneysweep", "Ratcatcher", "Bellringer", "Perfumer", "Entomologist", "Anatomist", "Mycologist", "Astronomer", "Genealogist", "Linguist", "Seismologist", "Ornithologist", "Curator", "Archaeologist", "Scribe", "Alchemist", "Haberdasher", "Fletcher", "Farrier", "Hatter", "Baker", "Brewer", "Tinsmith", "Tinker", "Miller", "Draper", "Gondolier", "Juggler", "Magician", "Acrobat", "Illusionist", "Sommelier", "Butcher", "Candlemaker", "Mender", "Mason", "Saddler", "Ropemaker", "Purveyor", "Scrivener", "Lapidary", "Numismatist", "Vintner", "Mercer", "Cordwainer", "Ostler", "Wainwright", "Wheelwright", "Pewterer", "Furrier", "Thatcher", "Dowser", "Diviner", "Illuminer", "Hagiographer", "Sinologist", "Philatelist", "Apiarist", "Antiquarian", "Steeplejack", "Hawker", "Sexton", "Mudlark", "Governess", "Corsetier", "Herbalist", "Tobacconist", "Sailmaker", "Chocolatier", "Vexillologist", "Ferryman", "Shipwright", "Quilter", "Upholsterer", "Physician", "Archivist", "Captain", "Architect", "Innkeeper", "Constable", "Emissary", "Notary", "Custodian", "Chancellor", "Surgeon", "Admiral", "Diplomat", "Magistrate", "Poet"];
const places = ["Alexandria", "Aswan", "Cairo", "Carthage", "Dakar", "Fez", "Johannesburg", "Lagos", "Luxor", "Maputo", "Marrakech", "Mombasa", "Ouidah", "Tangier", "Timbuktu", "Zanzibar", "Antioch", "Ayutthaya", "Babylon", "Bukhara", "Ephesus", "Hanoi", "Isfahan", "Istanbul", "Jaipur", "Jerusalem", "Kathmandu", "Kyoto", "Lhasa", "Mumbai", "Nara", "Petra", "Samarkand", "Tbilisi", "Troy", "Varanasi", "Yerevan", "Yogyakarta", "Antwerp", "Assisi", "Athens", "Avignon", "Bergen", "Bologna", "Bordeaux", "Bruges", "Budapest", "Carcassonne", "Constantinople", "Corinth", "Córdoba", "Delft", "Delphi", "Dubrovnik", "Florence", "Gdańsk", "Ghent", "Granada", "Heidelberg", "Kilkenny", "Kraków", "Lisbon", "Ljubljana", "Marseille", "Naples", "Palermo", "Petrograd", "Pompeii", "Prague", "Ravenna", "Riga", "Salamanca", "Salzburg", "Sarajevo", "Seville", "Sparta", "Syracuse", "Tallinn", "Thessaloniki", "Trieste", "Utrecht", "Venice", "Versailles", "Vienna", "Vilnius", "Warsaw", "Waterloo", "Cartagena", "Cusco", "Havana", "Quito", "Salvador", "Tenochtitlan", "Valparaíso", "Apia", "Fremantle", "Lautoka", "Oamaru", "Tahiti", "Savannah", "Salem", "Santa Fe", "New Orleans", "Nantucket", "Kumasi", "Elmina", "Meknes", "Essaouira", "Ibadan", "Melaka", "Bhaktapur", "Udaipur", "Arequipa", "Potosí", "Karakorum", "Rye", "Whitby", "Lübeck", "Lindisfarne", "Cádiz", "Siena", "Valletta", "Lahore", "Mandalay", "Rarotonga", "Puebla", "Oaxaca", "Tétouan", "Djenné", "Évora"];
const $ = id => document.getElementById(id);
let history = []; // Full history for this page session; reloading resets it.
let selectedBook = null;
// Hand-picked, faded library palette: pastels alongside old-paper and leather tones.
const washes = [
  '#E8D6D3', '#E5D3D5', '#E6D4CB', '#EDDFD1', '#EBDCCB',
  '#F0E8D2', '#F0E9CF', '#E8E2CC', '#E5DFD1', '#DDD4C4',
  '#DCCEBE', '#D5C4B6', '#D1C5B9', '#D9E0D4', '#DEE0CE',
  '#D2DFDA', '#D2E0E1', '#D4DFE8', '#D4DCE6', '#DDD9E9',
  '#E5DBE8', '#E2D7DF'
];
// Neighbouring palette entries are broadly related; avoid nearby indices.
// Blend a palette shade towards a highlight or shadow without introducing grey overlays.
function blendHex(hex, target, amount) {
  const channel = (value, offset) => parseInt(value.slice(offset, offset + 2), 16);
  const mixed = [1, 3, 5].map(i => Math.round(channel(hex, i) * (1 - amount) + channel(target, i) * amount));
  return '#' + mixed.map(v => v.toString(16).padStart(2, '0')).join('');
}
const spineFont = 'Baskerville, "Baskerville Old Face", "Libre Baskerville", "Times New Roman", serif';
const spineFontSize = 13.5;
const canvas = document.createElement('canvas');
const measureContext = canvas.getContext('2d');
function titleText(job, place) { return `The ${job} of ${place}`; }
function textLength(title) {
  measureContext.font = `${spineFontSize}px ${spineFont}`;
  return measureContext.measureText(title).width;
}
// Calculate the longest possible title before any books are added.
const longestTitle = titleText(
  jobs.reduce((a, b) => textLength(a) > textLength(b) ? a : b),
  places.reduce((a, b) => textLength(a) > textLength(b) ? a : b)
);
const maximumSpineHeight = Math.ceil(textLength(longestTitle) + 40 + 24);
$('shelf-scroll').style.setProperty('--shelf-height', `${maximumSpineHeight + 16}px`);
let bookSerial = 0;
function chooseColour() {
  const previous = history.slice(0, 3).map(item => item.appearance.colourIndex);
  const last = previous[0];
  const candidates = washes.map((_, index) => index).filter(index =>
    !previous.some(other => Math.min(Math.abs(index - other), washes.length - Math.abs(index - other)) < 3)
  );
  return randomItem(candidates.length ? candidates : washes.map((_, index) => index));
}
function populate(id, items, initial) {
  const select = $(id);
  for (const value of items) {
    const option = document.createElement('option'); option.value = value; option.textContent = value; select.append(option);
  }
  select.value = initial;
}
function currentTitle() { return `The ${$('job').value} of ${$('place').value}`; }
function updateTitle() { $('title').textContent = currentTitle(); $('status').textContent = ''; }
function randomItem(items) { return items[Math.floor(Math.random() * items.length)]; }
function shuffled(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function newAppearance() {
  return {
    width: 39 + Math.floor(Math.random() * 21),
    height: maximumSpineHeight - Math.floor(Math.random() * 24),
    colourIndex: chooseColour(),
    tilt: (Math.random() - .5) * 1.5,
    seed: Math.random() * 3 - 1.5,
    shadeHeight: 0.10 + Math.random() * 0.18,
    curveDepth: 0.10 + Math.random() * 0.05,
    shadeOpacity: 0.78 + Math.random() * 0.22,
    colourOpacity: 0.76 + Math.random() * 0.10,
    washVariant: Math.random(),
    tintWidth: 0.17 + Math.random() * 0.16,
    id: ++bookSerial
  };
}
function renderShelf() {
  const shelf = $('shelf-scroll');
  shelf.replaceChildren();
  $('shelf-section').hidden = history.length === 0;
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attributes = {}) => {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    return node;
  };
  // Chronological left-to-right: newest volume appears at the right edge.
  for (const entry of [...history].reverse()) {
    const a = entry.appearance || (entry.appearance = newAppearance());
    const title = titleText(entry.job, entry.place);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'book-spine';
    button.setAttribute('aria-label', `Show ${title}`);
    button.title = title;
    button.style.transform = `rotate(${a.tilt}deg)`;
    const w = a.width, h = a.height, k = a.seed;
    const svg = el('svg', {width: w, height: h, viewBox: `0 0 ${w} ${h}`, 'aria-hidden': 'true'});
    const defs = el('defs');
    const hatchId = `hatch-${a.id}`, clipId = `clip-${a.id}`, fadeId = `fade-${a.id}`;
    const pencilId = `pencil-${a.id}`, blurId = `soft-${a.id}`, bodyClipId = `body-${a.id}`;
    const hatch = el('pattern', {id: hatchId, width: 2.6, height: 2.6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(35)'});
    hatch.append(el('path', {d: 'M 0 0 V 2.6', stroke: '#28332f', 'stroke-width': 0.6, 'stroke-opacity': 0.52}));
    const top = h * (1 - a.shadeHeight);
    const dip = w * a.curveDepth;
    const clip = el('clipPath', {id: clipId});
    // Only the hatch marks are clipped; no visible curve is drawn.
    clip.append(el('path', {d: `M 2 ${top} Q ${w / 2} ${top + 2 * dip} ${w - 2} ${top} L ${w - 2} ${h - 3} L 2 ${h - 3} Z`}));
    const fade = el('linearGradient', {id: fadeId, gradientUnits: 'userSpaceOnUse', x1: 0, y1: top, x2: 0, y2: h});
    fade.append(
      el('stop', {offset: '0%', 'stop-color': 'white', 'stop-opacity': 0.30}),
      el('stop', {offset: '100%', 'stop-color': 'white', 'stop-opacity': a.shadeOpacity})
    );
    const maskId = `mask-${a.id}`;
    const mask = el('mask', {id: maskId, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: w, height: h});
    mask.append(el('rect', {x: 0, y: 0, width: w, height: h, fill: `url(#${fadeId})`}));
    const pencilGradient = el('linearGradient', {id: pencilId, x1: '0%', y1: '0%', x2: '100%', y2: '100%'});
    pencilGradient.append(
      el('stop', {offset: '0%', 'stop-color': '#47413d', 'stop-opacity': .18}),
      el('stop', {offset: '35%', 'stop-color': '#47413d', 'stop-opacity': .55}),
      el('stop', {offset: '70%', 'stop-color': '#47413d', 'stop-opacity': .25}),
      el('stop', {offset: '100%', 'stop-color': '#47413d', 'stop-opacity': .48})
    );
    const soft = el('filter', {id: blurId, x: '-10%', y: '-10%', width: '120%', height: '120%'});
    soft.append(el('feGaussianBlur', {stdDeviation: .42}));
    const bodyClip = el('clipPath', {id: bodyClipId});
    const outline = `M 2 ${3 + k} Q ${w / 2} ${1 - k} ${w - 2} ${3 - k} L ${w - 2 + k} ${h - 3} Q ${w / 2} ${h - 1 + k} 2 ${h - 3} Z`;
    bodyClip.append(el('path', {d: outline}));
    defs.append(hatch, clip, fade, mask, pencilGradient, soft, bodyClip);
    const shadow = el('path', {d: outline, fill: '#36413c', 'fill-opacity': 0.29, transform: 'translate(3.6 2.5)'});
    // An ivory undercoat and semi-transparent pigment keep the palette washed out.
    const paper = el('path', {d: outline, fill: '#F8F4EB'});
    const spine = el('path', {d: outline, fill: washes[a.colourIndex], 'fill-opacity': a.colourOpacity});
    const washGroup = el('g', {'clip-path': `url(#${bodyClipId})`});
    // A softly squared, rounded-oblong highlight and an independently curved
    // lower pigment pool. Their slight asymmetry keeps the drawing organic.

  const availableTemplates=templates.map((_,i)=>i).filter(i=>!recentReviewTemplates.includes(`${family}-${i}`));

  recentReviewFamilies.push(family);if(recentReviewFamilies.length>3)recentReviewFamilies.shift();
  recentReviewTemplates.push(`${family}-${index}`);if(recentReviewTemplates.length>12)recentReviewTemplates.shift();
  return expandReview(templates[index]);
}
const credentials=['bestselling author','acclaimed novelist','award-winning author','historical fiction author','critically acclaimed writer','celebrated storyteller','prize-nominated novelist','author of several historical novels','acclaimed historical novelist','internationally bestselling novelist','distinguished literary figure','author of several published works'];
function makeAttribution(author) {
  if(Math.random()>=.15) return publicationName();
  const eligible=history.filter(book=>book.author!==author && book.author.split(' ').at(-1)!==author.split(' ').at(-1));
  if(eligible.length && Math.random()<.60) {
    const previous=randomItem(eligible);
    return `${previous.author}, author of The ${previous.job} of ${previous.place}`;
  }
  const reviewer=makeAuthor(new Set([author]));
  return `${reviewer}, ${randomItem(credentials)}`;
}
// Once per session, two books are scheduled to endorse one another.
// Both identities and titles exist before either appears on the shelf.
let generationCount=0;
let reciprocalPair=null;
function planReciprocalPair() {
  const firstAt=11+Math.floor(Math.random()*10); // 11th–20th generation
  const secondAt=firstAt+8+Math.floor(Math.random()*5); // 8–12 books later
  const firstJob=randomItem(jobs);
  const firstPlace=randomItem(places.filter(p=>p[0].toLowerCase()!==firstJob[0].toLowerCase()));
  const secondJob=randomItem(jobs.filter(j=>j!==firstJob));
  const secondPlace=randomItem(places.filter(p=>p!==firstPlace && p[0].toLowerCase()!==secondJob[0].toLowerCase()));
  const firstAuthor=makeAuthor();
  const secondAuthor=makeAuthor(new Set([firstAuthor]));
  return {
    firstAt, secondAt,
    first:{job:firstJob,place:firstPlace,author:firstAuthor},
    second:{job:secondJob,place:secondPlace,author:secondAuthor}
  };
}
function reciprocalAttribution(reviewer) {
  return `${reviewer.author}, author of The ${reviewer.job} of ${reviewer.place}`;
}
const awardNames=[
  'Historical Narrative Prize','Historical Fiction Book Prize','Literary Fiction Prize',
  'English Historical Novel Award','Prize for Historical Literature','Annual Fiction Award',
  'Society for Historical Fiction Award','Historical Novelists’ Guild Prize',
  'Literary Society Book Awards','Prize for Excellence in Historical Storytelling',
  'Award for Distinguished Historical Storytelling','Literary Achievement Prize',
  'Historical Storytelling Award','Historical Letters Prize','Historical Fiction Critics’ Award'
];
const rareAwardNames=['Annual Prize for Fiction Set in the Past','Award for Outstanding Achievement in Historical Fiction Writing','Excellence in the Depiction of Previous Centuries Award'];
let booksUntilAward=4+Math.floor(Math.random()*6);
function makeAward() {
  booksUntilAward--;
  if(booksUntilAward>0)return null;
  booksUntilAward=4+Math.floor(Math.random()*6);
  const status=weighted([['Shortlisted',35],['Longlisted',25],['A contender',14],['Highly commended',13],['Runner-up',8],['Winner',5]]);
  const name=randomItem(Math.random()<.025?rareAwardNames:awardNames);
  const prefix=status==='A contender'?'A contender for the':status==='Highly commended'?'Highly commended for the':status==='Runner-up'?'Runner-up for the':status==='Winner'?'Winner of the':`${status} for the`;
  return {status,name,text:`${prefix} ${name}`};
}
function showBook(book) {
  selectedBook = book;
  $('job').value=book.job;$('place').value=book.place;updateTitle();
  $('tagline-text').textContent=book.tagline;fitTagline();
  $('book-author').textContent=`by ${book.author}`;
  $('review-quote').textContent=`“${book.review}”`;
  $('review-source').textContent=`— ${book.attribution}`;
  const corner=$('award-corner'),ribbon=$('award-ribbon');
  corner.hidden=!book.award;
  if(book.award){$('award-text').textContent=book.award.name; ribbon.textContent=book.award.status.toUpperCase();corner.classList.toggle('winner',book.award.status==='Winner');}
  else corner.classList.remove('winner');
}

function winnerConfetti() {
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const layer=$('confetti-layer');
  layer.replaceChildren();
  const colours=['#c8ac74','#e8d8ae','#d6c4bb','#c5d5c9','#d2c9e1','#e6d6ce'];
  for(let i=0;i<28;i++){
    const piece=document.createElement('span');
    piece.className='confetti-piece';
    const fromLeft=i%2===0;
    piece.style.left=fromLeft?'12%':'88%';
    piece.style.top='12%';
    piece.style.setProperty('--confetti-colour',colours[Math.floor(Math.random()*colours.length)]);
    piece.style.setProperty('--dx',`${(fromLeft?1:-1)*(20+Math.random()*210)}px`);
    piece.style.setProperty('--dy',`${60+Math.random()*165}px`);
    piece.style.setProperty('--spin',`${(Math.random()-.5)*900}deg`);
    piece.style.setProperty('--delay',`${Math.random()*190}ms`);
    layer.append(piece);
  }
  window.setTimeout(()=>{if(layer.isConnected)layer.replaceChildren();},2200);
}
function generate() {
  const recent = history.slice(0, Number($('lookback').value));
  const blockedJobs = new Set(recent.map(entry => entry.job));
  const blockedPlaces = new Set(recent.map(entry => entry.place));
  const availableJobs = jobs.filter(job => !blockedJobs.has(job));
  const job = randomItem(availableJobs.length ? availableJobs : jobs);
  const eligiblePlaces = places.filter(place => !blockedPlaces.has(place) && (!$('avoid').checked || place[0].toLowerCase() !== job[0].toLowerCase()));
  const fallbackPlaces = places.filter(place => !$('avoid').checked || place[0].toLowerCase() !== job[0].toLowerCase());
  const place = randomItem(eligiblePlaces.length ? eligiblePlaces : fallbackPlaces.length ? fallbackPlaces : places);
  generationCount++;
  const firstMatch=reciprocalPair && generationCount===reciprocalPair.firstAt;
  const secondMatch=reciprocalPair && generationCount===reciprocalPair.secondAt;
  const planned=firstMatch?reciprocalPair.first:secondMatch?reciprocalPair.second:null;
  const bookJob=planned?planned.job:job;
  const bookPlace=planned?planned.place:place;
  const author=planned?planned.author:makeAuthor();
  const attribution=firstMatch?reciprocalAttribution(reciprocalPair.second)
    :secondMatch?reciprocalAttribution(reciprocalPair.first):makeAttribution(author);
  const book={job:bookJob,place:bookPlace,appearance:newAppearance(),author,tagline:generateTagline(),review:makeReview(),attribution,award:makeAward()};
  history.unshift(book);showBook(book);renderHistory();
  if(book.award?.status==='Winner')winnerConfetti();
}
async function copyTitle() {
  const book=selectedBook;
  if(!book)return;
  const lines=[`The ${book.job} of ${book.place}`,`by ${book.author}`,'',book.tagline,'',`“${book.review}”`,`— ${book.attribution}`];
  if(book.award)lines.push('',book.award.text);
  const listing=lines.join('\n');
  try {
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(listing);
    else {
      const field=document.createElement('textarea');field.value=listing;
      field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();
      const success=document.execCommand('copy');field.remove();if(!success)throw new Error('Copy unavailable');
    }
    $('status').textContent='Book details copied.';
  } catch { $('status').textContent='Copy unavailable in this browser.'; }
}
populate('job', shuffled(jobs), 'Taxidermist'); populate('place', shuffled(places), 'Timbuktu');
$('job').addEventListener('change', updateTitle); $('place').addEventListener('change', updateTitle);
$('generate').addEventListener('click', generate); $('copy').addEventListener('click', copyTitle);
$('clear').addEventListener('click', () => { history = []; usedAuthors.clear(); usedPublications.length=0; booksUntilAward=4+Math.floor(Math.random()*6); generationCount=0; reciprocalPair=planReciprocalPair(); renderHistory(); });
// Preassign the reciprocal reviewers before the first book is generated.
reciprocalPair=planReciprocalPair();
// Create the first complete book on load, including its tagline and metadata.
generate();
</script>
